0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="335.9941" x="449" y="616.5283">AC1: A city name cannot have special characters or digits.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="382.9858" x="449" y="633.8193">AC2: The house blocks can be assigned manually or automatically</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="393.8022" x="449" y="651.1104">(randomly around the city tag position accordingly to normal distribu-</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="25.2891" x="449" y="668.4014">tion)</text></g><g id="elem_GMN31"><path d="M436,712 L436,748.74 L356.87,746.73 L436,756.74 L436,825.7461 A0,0 0 0 0 436,825.7461 L864.5513,825.7461 A0,0 0 0 0 864.5513,825.7461 L864.5513,722 L854.5513,712 L436,712 A0,0 0 0 0 436,712 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M854.5513,712 L854.5513,722 L864.5513,722 L854.5513,712 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="370.6841" x="442" y="731.0283">AC1: Definition of the behaviour of ports, which cargoes they im-</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="164.7407" x="442" y="748.3193">port/export and/or transform;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="407.5513" x="442" y="765.6104">AC2: Definition of the available locomotion types (steam, diesel, and/or</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="49.1182" x="442" y="782.9014">electric).</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="401.0386" x="442" y="800.1924">AC3: (Re)Definition of the factors that alter the generation (frequency)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="135.1416" x="442" y="817.4834">of generating industries</text></g><g id="elem_GMN34"><path d="M544.5,110.5 L544.5,120 L352.58,124 L544.5,128 L544.5,137.791 A0,0 0 0 0 544.5,137.791 L756.9897,137.791 A0,0 0 0 0 756.9897,137.791 L756.9897,120.5 L746.9897,110.5 L544.5,110.5 A0,0 0 0 0 544.5,110.5 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M746.9897,110.5 L746.9897,120.5 L756.9897,120.5 L746.9897,110.5 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="191.4897" x="550.5" y="129.5283">AC1: Overbuilding is not possible</text></g><g id="elem_GMN37"><path d="M441,335.5 L441,354 L361.22,358 L441,362 L441,380.082 A0,0 0 0 0 441,380.082 L860.1504,380.082 A0,0 0 0 0 860.1504,380.082 L860.1504,345.5 L850.1504,335.5 L441,335.5 A0,0 0 0 0 441,335.5 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M850.1504,335.5 L850.1504,345.5 L860.1504,345.5 L850.1504,335.5 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="398.1504" x="447" y="354.5283">AC1: The player should choose the locomotive from a list of available</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="309.9814" x="447" y="371.8193">locomotives for the scenario as well as a current date.</text></g><g id="elem_GMN40"><path d="M551,22.5 L551,41 L374.63,45 L551,49 L551,67.082 A0,0 0 0 0 551,67.082 L750.4897,67.082 A0,0 0 0 0 750.4897,67.082 L750.4897,32.5 L740.4897,22.5 L551,22.5 A0,0 0 0 0 551,22.5 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M740.4897,22.5 L740.4897,32.5 L750.4897,32.5 L740.4897,22.5 " fill="#FEFFDD" style="stroke:#181818;stroke-width: